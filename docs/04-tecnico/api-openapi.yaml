openapi: 3.0.3
info:
  title: 'Wings API (CONGELADA -- no se sirve en produccion)'
  version: "1.0.0-frozen"
  description: >-
    Catalogo liviano de la API REST de Wings, generado desde las rutas reales
    de routes/api.php el 2026-07-26. La API esta deshabilitada desde el fix
    de seguridad S2 (2026-07-13): routes/api.php existe en el repo pero
    bootstrap/app.php NO la carga, asi que ningun endpoint de aca responde
    en produccion ni en local. Ver docs/07-evaluacion/seguridad/REPORTE-SEGURIDAD.md
    (S2.0-S4.0, S6.0) y docs/07-evaluacion/ANALISIS-INTEGRAL.md (I2.0).
    Este documento cataloga metodo, path, controller/accion y el rol minimo
    requerido por el middleware de cada ruta -- NO incluye request/response
    body detallado (decision de alcance: catalogo liviano, no documentacion
    completa). Sirve para saber que existe antes de decidir si se reactiva
    para una futura app movil, y como insumo de auditoria de seguridad si
    eso llega a pasar (S2.0 exige gate de rol correcto por endpoint antes
    de reactivar, no solo auth:sanctum).
servers:
  - url: /api
    description: 'Prefijo real (la API completa esta deshabilitada, ver arriba)'
